<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <!--
     CONCEPT: RPS WITH DOM UPDATES (instead of alert())
     - Previous version used alert() for output — blocks the page and looks ugly.
     - This version uses DOM manipulation to display results INSIDE the page.
     - We create dedicated <p> elements with class names for JS to target.
     - This is a major upgrade: the UI feels more like a real app.
     - NEW: updateScore() function — a separate function to update the score display.
       This follows the "separation of concerns" principle: one function per task.
    -->

    <p>Rock Paper Scissors</p>
    <button onclick="
      playgame('rock');
    ">Rock</button>

    <button onclick="
      playgame('paper');
    ">Paper</button>

    <button onclick="
      playgame('scissors');
    ">Scissors</button>

    <!-- These empty <p> elements are PLACEHOLDERS — JS will fill them with content -->
    <p class="js-result"></p>   <!-- Shows: "You win." / "You lose." / "Tie." -->
    <p class="js-moves"></p>    <!-- Shows: which moves were played -->
    <p class="js-score"></p>    <!-- Shows: running score -->

    <button onclick="
      score.win = 0;
      score.lose = 0;
      score.tie = 0;
      localStorage.removeItem('score');
      updateScore();
      ">Reset Score</button>


    <script>
      // Load saved score from localStorage, or use defaults if nothing saved
      let score = JSON.parse(localStorage.getItem('score')) || {
        win: 0,
        lose:0,
        tie:0
      };

      // Display the score on page load (not just after a game)
      updateScore();

      
      function playgame(playermove){
        const computerMove = pickComputerMove();
        let result = '';

        if(playermove === 'rock'){
          if (computerMove === 'rock'){
            result = 'Tie.';
          } else if (computerMove === 'paper') {
            result = 'You lose.';
          } else if (computerMove === 'scissors') {
            result = 'You win.';
          }
        } else if(playermove === 'paper'){
            if (computerMove === 'rock') {
            result = 'You win.';
          } else if (computerMove === 'paper') {
            result = 'Tie.';
          } else if (computerMove === 'scissors') {
            result = 'You lose.';
          }
        } else if(playermove === 'scissors'){
          if (computerMove === 'rock') {
            result = 'You lose.';
          } else if (computerMove === 'paper') {
            result = 'You win.';
          } else if (computerMove === 'scissors') {
            result = 'Tie.';
          }
        }
        if(result === 'You win.'){
          score.win += 1;
        }
        else if(result === 'You lose.'){
          score.lose += 1;
        }
        else if(result === 'Tie.'){
          score.tie += 1;
        }

        localStorage.setItem('score' , JSON.stringify(score));

        /*
         CONCEPT: UPDATING THE DOM INSTEAD OF USING alert()
         - querySelector('.js-result').innerHTML = result → puts the result text IN the page.
         - This is better than alert() because:
           1. The page stays interactive (alert blocks everything)
           2. The result is visible alongside the rest of the page
           3. It looks like a real web app, not a popup
        */
        document.querySelector('.js-result').innerHTML = result;
        document.querySelector('.js-moves').innerHTML = `you ${playermove}-${computerMove} computer`
        updateScore();  // Re-render the score display

      }
      
      /*
       updateScore() — a dedicated function to update the score display.
       CONCEPT: Separating display logic from game logic.
       This function can be called from MULTIPLE places:
       - After each game round
       - After resetting the score
       - On page load
       Having one function prevents duplicating the DOM update code.
      */
      function updateScore(){
        document.querySelector('.js-score')
          .innerHTML = `Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`;
      }

      function pickComputerMove(){
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'scissors';
        }
        return computerMove;
      }
      
    </script>
  </body>
</html>
</body>
</html>
