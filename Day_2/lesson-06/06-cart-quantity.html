<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <!--
     CONCEPT: INPUT VALIDATION WITH IF-STATEMENTS
     - Before modifying data, we CHECK if the operation is valid.
     - This prevents the cart from going over 10 or below 0.
     - alert() shows a popup message to the user — useful for quick feedback.
     - This is an example of BOUNDARY CHECKING / GUARD CLAUSES:
       "Before doing the action, check if it's allowed."
     - Pattern: if (wouldExceedLimit) { alert(); } else { doTheAction(); }
    -->

    <!-- Show current cart value — just reads, doesn't modify -->
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <!--
     ADD BUTTONS: Each checks if adding would exceed the MAX (10).
     cartQuantity+1 > 10 checks the FUTURE value, not the current one.
     This way we prevent the add before it happens.
    -->
    <button onclick="
      if(cartQuantity+1 > 10){
        alert('The Cart is full');
      }
      else{
        cartQuantity++;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">Add to Cart</button>

    <button onclick="
      if(cartQuantity+2 > 10){
        alert('The Cart is full');
      }
      else{
        cartQuantity += 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">+2</button>

    <button onclick="
      if(cartQuantity+3 > 10){
        alert('The Cart is full');
      }
      else{
        cartQuantity = cartQuantity +3;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">+3</button>

    <button onclick="
      if(cartQuantity+4 > 10){
        alert('The Cart is full');
      }
      else{
        cartQuantity = cartQuantity + 4;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">+4</button>

    <button onclick="
      if(cartQuantity+5 > 10){
        alert('The Cart is full');
      }
      else{
        cartQuantity = cartQuantity + 5;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">+5</button>

    <!--
     REMOVE BUTTONS: Check if removing would go below the MIN (0).
     cartQuantity-1 < 0 checks if the result would be negative.
     This prevents the cart from having a negative quantity.
    -->
    <!-- vvv This code was changed. vvv -->
    <button onclick="
      if(cartQuantity-1 < 0){
        alert('Not enough items in the cart ');
      }
      else{
        cartQuantity = cartQuantity - 1;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
      
      ">Remove from cart</button>

    <button onclick="
      if(cartQuantity-2 < 0){
        alert('Not enough items in the cart ');
      }
      else{
        cartQuantity = cartQuantity - 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">-2</button>

    <button onclick="
      if(cartQuantity-3 < 0){
        alert('Not enough items in the cart ');
      }
      else{
        cartQuantity = cartQuantity - 3;
        console.log(`Cart quantity: ${cartQuantity}`);
      }  
    ">-3</button>
    <!-- ^^^ This code was changed. ^^^ -->

    <!-- Reset directly sets the value to 0 — no validation needed -->
    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <script>
      // Global state variable — starts at 0, shared by all buttons
      let cartQuantity = 0;
    </script>
  </body>
</html>
