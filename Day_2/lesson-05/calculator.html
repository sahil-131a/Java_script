<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <!--
     CONCEPT: BUILDING A CALCULATOR WITH STRING CONCATENATION & eval()
     - This calculator builds a math expression as a STRING by appending characters.
     - Each button click appends its character (number or operator) to the 'calculation' string.
       Example: clicking 1, +, 2 builds the string "1 + 2"
     - The = button uses eval() to EVALUATE the string as actual JavaScript code.
       eval("1 + 2") → returns 3
     - eval() is powerful but DANGEROUS in production code because it executes ANY JS string.
       (A malicious user could inject harmful code.) Use it only for learning purposes.
     - The 'clear' button resets the string to '' (empty string) to start a new calculation.
     - KEY CONCEPT: String concatenation with += to build up a value over multiple clicks.
    -->

    <p>Calculator</p>

    <!-- Row 1: digits 1-3 and + operator -->
    <p>
        <!-- Each button appends its character to the 'calculation' string -->
        <button onclick="
            calculation += '1';
            console.log(calculation);
            ">1</button>
        <button onclick="
            calculation += '2';
            console.log(calculation);
            ">2</button>
        <button onclick="
            calculation += '3';
            console.log(calculation);
            ">3</button>    
        <!-- Operators are added with spaces for readability in the expression string -->
        <button onclick="
            calculation += ' + ';
            console.log(calculation);
            ">+</button>
        
    </p>

    <!-- Row 2: digits 4-6 and - operator -->
    <p>
        <button onclick="
            calculation += '4';
            console.log(calculation);
            ">4</button>
        <button onclick="
            calculation += '5';
            console.log(calculation);
            ">5</button>
        <button onclick="
            calculation += '6';
            console.log(calculation);
            ">6</button>
        <button onclick="
            calculation += ' - ';
            console.log(calculation);
            ">-</button>                
    </p>

    <!-- Row 3: digits 7-9 and * operator -->
    <p>
        <button onclick="
            calculation += '7';
            console.log(calculation);
            ">7</button>
        <button onclick="
            calculation += '8';
            console.log(calculation);
            ">8</button>
        <button onclick="
            calculation += '9';
            console.log(calculation);
            ">9</button>
        <button onclick="
            calculation += ' * ';
            console.log(calculation);
            ">*</button>
    </p>

    <!-- Row 4: 0, decimal point, equals (eval), and / operator -->
    <p>
        <button onclick="
            calculation += '0';
            console.log(calculation);
            ">0</button>
        <button onclick="
            calculation += '.';
            console.log(calculation);
            ">.</button>
        <!--
         eval() takes a STRING and executes it as JavaScript code.
         "1 + 2 * 3" → eval returns 7 (respects operator precedence)
         The result REPLACES the string, so you can continue calculating.
        -->
        <button onclick="
            calculation = eval(calculation);
            console.log(calculation);
            ">=</button>
        <button onclick="
            calculation += ' / ';
            console.log(calculation);
            ">/</button>
    </p>

    <!-- Clear button resets the expression to an empty string -->
    <button onclick="
        calculation = '';
        console.log(calculation);
        ">
        clear
    </button>
        
    <script>
        /*
         'calculation' stores the expression as a STRING.
         It starts as an empty string '' and grows as the user clicks buttons.
         Using 'let' because this value changes constantly.
        */
        let calculation = '';
    </script>
</body>
</html>
