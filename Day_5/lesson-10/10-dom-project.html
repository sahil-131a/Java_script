<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom-project</title>
    <!--
     CONCEPT: CSS STYLING + DOM INTERACTION
     - This is the SAME project as Day 4 (09-dom-project) but now with CSS styling.
     - CSS makes the buttons look professional (rounded, colored, hover cursors).
     - The key new concept is using classList.add() and classList.remove() to
       toggle CSS classes with JavaScript.
    -->
    <style>
        body{
            font-family: Arial;
        }
        /* Base button style — black background, white text, rounded corners */
        .subscribe-button{
            background-color: black;
            color: white;
            border: none;
            font-size: 15px;
            padding: 10px 18px 10px 18px;  /* top right bottom left */
            font-weight: bold;
            border-radius: 18px;           /* Rounded corners — higher value = more round */
            cursor: pointer;               /* Shows hand cursor on hover */
            margin-bottom: 50px;

        }
        /*
         CONCEPT: CSS STATE CLASS
         - .is-subscribed is a CSS class that represents the "subscribed" state.
         - Instead of changing styles manually in JS, we TOGGLE this class on/off.
         - This keeps styling in CSS and logic in JS — separation of concerns!
        */
        .is-subscribed{
            background-color: rgb(240 , 240 ,240);  /* Light gray when subscribed */
            color: black;
        }
        .input-price{
            padding: 12px;
            font-size: 15px;
        }
        .Calculate-button{
            border: none;
            padding: 13px 12px 13px 12px;
            background-color: rgb(6, 148, 6);  /* Green button */
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p>
        Youtube Subscribe Button
    </p>
    <!--
     The button has TWO classes:
     - 'js-subscribe-button' → for JavaScript to find it (js- prefix convention)
     - 'subscribe-button'    → for CSS styling
     Using js- prefix helps separate JS selectors from styling selectors.
    -->
    <button class="js-subscribe-button subscribe-button" onclick="
        subscribe()">
        Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Order under $40 =+ $10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>

    <input type="text" placeholder="Cost of order" class="input-value  input-price" onkeydown="
        handleKeyDown(event);
        ">
    <button class="Calculate-button" onclick="
        Calculate();
        " >Calculate</button>

    <P class="js-price"></P>

    <script>
        function handleKeyDown(event){
            if(event.key === 'Enter'){
                Calculate();
            }
        }
        function Calculate(){
            const inputElement = document.querySelector('.input-value');
            let cost = Number(inputElement.value);

            if(cost < 40){
                cost = cost + 10;
            }

            document.querySelector('.js-price')
                .innerHTML = `$${cost}`; 
    
        }
        
        function subscribe(){
            const buttonElement = document.querySelector('.js-subscribe-button');

            if(buttonElement.innerText === 'Subscribe'){
                buttonElement.innerText = 'Subscribed'
                /*
                 CONCEPT: classList.add() and classList.remove()
                 - classList is a property on every DOM element — it manages CSS classes.
                 - classList.add('className') → adds a CSS class to the element.
                 - classList.remove('className') → removes a CSS class from the element.
                 - classList.toggle('className') → adds if missing, removes if present.
                 - classList.contains('className') → checks if the class exists (returns boolean).
                 - This is the PROPER way to change styles with JS — don't set styles directly!
                   Keep styles in CSS, and just toggle classes with JS.
                */
                buttonElement.classList.add('is-subscribed');    // Adds gray background style
            }
            else{
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('is-subscribed'); // Removes gray, back to black
            }
        }
    </script>
</body>
</html>
