<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays amd loops</title>
</head>
<body>
    <script>
        /*
         CONCEPT: ARRAYS IN JAVASCRIPT
         - An array is an ORDERED LIST of values, stored in a single variable.
         - Created with square brackets: [value1, value2, value3]
         - Arrays are ZERO-INDEXED: first element is at index 0, second at 1, etc.
         - Arrays can hold ANY type of value, and you can MIX types in one array:
           [1, 'hello', true, {name: 'socks'}, [1, 2]]
         - typeof [] returns "object" — arrays ARE objects in JS (a quirk).
         - Use Array.isArray(value) to check if something is truly an array.

         KEY ARRAY METHODS:
         - .push(value)        → adds an element to the END of the array
         - .splice(start, count) → removes 'count' elements starting at index 'start'
         - .length             → returns the number of elements in the array
         - .slice()            → creates a COPY of the array (without modifying original)
        */

        /*
        const myArray = [10 , 20 , 30];
        console.log(myArray);
        
        // Access by INDEX — myArray[0] is the first element
        console.log(myArray[0]);        // 10

        // Modify by INDEX — arrays declared with 'const' can still have elements changed!
        // 'const' prevents reassigning the variable, not modifying the array contents.
        myArray[0] = 90;
        console.log(myArray);           // [90, 20, 30]


        // Arrays can hold MIXED types — numbers, strings, booleans, objects, even other arrays!
        [1 , 'hello' , true , {name : 'socks'} , [1 , 2]];

        // typeof returns "object" for arrays (not "array") — this is a JS quirk
        console.log(typeof [1 , 2]);          // "object"

        // Array.isArray() is the CORRECT way to check if something is an array
        console.log(Array.isArray([1 , 2]));  // true

        // .push() adds to the END of the array
        myArray.push(10);
        console.log(myArray);                 // [90, 20, 30, 10]

        // .splice(startIndex, deleteCount) removes elements from the array
        // splice(0, 2) → starting at index 0, remove 2 elements
        myArray.splice(0 , 2);
        console.log(myArray);                 // [30, 10] — first 2 elements removed
        */


        /*
         CONCEPT: LOOPS — Repeating code automatically

         WHILE LOOP:
         - Repeats code as long as the condition is true.
         - Structure: while(condition) { code; updateCondition; }
         - Use when you DON'T know how many times to repeat (e.g., until a condition is met).
         - WARNING: If the condition never becomes false, you get an INFINITE LOOP (crash!).

         FOR LOOP:
         - Repeats code a SPECIFIC number of times.
         - Structure: for(initialization; condition; update) { code; }
         - Use when you KNOW how many times to repeat (e.g., loop through an array).
         - The three parts: let i = 0 (start); i < 5 (continue while); i++ (after each loop)
        */

        /* loop

        // WHILE loop — i starts at 1, increments each time, stops when i reaches 5
        let i = 1;
        while(i < 5){
            console.log(i);   // Logs: 1, 2, 3, 4
            i++;
        }

       
        // FOR loop — more compact syntax for counted loops
        // (let i = 0; i <= 5; i++) means: start at 0, keep going while i ≤ 5, add 1 each time
        for(let i = 0 ; i <= 5 ; i++){
            console.log(i);   // Logs: 0, 1, 2, 3, 4, 5
        }

        // WHILE loop for UNKNOWN iterations — keep generating random numbers until > 0.5
        let randomNum = 0;

        // while loop we use when we dont know exactly when the loop to stop 
        while(randomNum < 0.5){
            randomNum = Math.random();
        }
        console.log(randomNum);  // A random number >= 0.5
        */
        

        /*
         CONCEPT: LOOPING THROUGH ARRAYS
         - Use array.length to get the number of elements.
         - Loop from index 0 to length-1 to access every element.
         - This is one of the most common patterns in JavaScript!
        */

        /*
        const myArr = [1 , 3 , 5];
        let total = 0;
        // ACCUMULATOR PATTERN: start with 0, add each element to the total
        for(let i = 0 ; i < myArr.length; i++){
            total += myArr[i];   // total = total + current element
        }
        console.log(total);      // 9 (1 + 3 + 5)
        */

        /*
         CONCEPT: COPYING ARRAYS WITH .slice()
         - .slice() (with no arguments) creates a SHALLOW COPY of the array.
         - The copy is a NEW array — modifying it doesn't affect the original.
         - Without slice, both variables would point to the SAME array in memory
           (reference type behavior).
        */

        /*
        const arr1 = [1 , 2 , 3 ];
        // to make a copy of this array 
        const arr2 = arr1.slice();   // Creates a new independent copy
        arr2.push(4);
        console.log(arr1);           // [1, 2, 3] — original unchanged!
        console.log(arr2);           // [1, 2, 3, 4] — only the copy changed
        */


        /*
         CONCEPT: break AND continue IN LOOPS
         - 'continue' → SKIPS the current iteration and jumps to the next one.
         - 'break' → EXITS the loop entirely, stopping all further iterations.
         - These give you finer control over loop execution.
        */
        for(let i = 1 ; i <= 10 ; i++){
            if(i === 3){
                continue;   // When i is 3, skip this iteration (don't log 3)
            }
            if(i === 8 ){
                break;      // When i is 8, exit the loop entirely (don't log 8, 9, 10)
            }
            console.log(i); // Logs: 1, 2, 4, 5, 6, 7 (skips 3, stops before 8)
        }

    </script>
</body>
</html>
